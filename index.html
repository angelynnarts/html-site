<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelynn Arts</title>

<style>
/* ===== FONTS (FIX THESE FILENAMES IF NEEDED) ===== */
@font-face {
  font-family: 'BodoniModa';
  src: url('https://raw.githubusercontent.com/angelynnarts/mysite-fonts/main/BodoniModa.ttf') format('truetype');
}

body {
  margin: 0;
  background-color: #F3DEFA;
  font-family: 'BodoniModa', serif;
}

/* ===== LAYOUT ===== */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* HERO */
.hero {
  text-align: center;
  padding: 100px 20px 60px;
}

.hero h1 {
  font-size: 48px;
  margin: 0;
}

/* IMAGE SECTION */
.image-block {
  margin: 40px 0;
  text-align: center;
}

.image-block img {
  width: 100%;
  max-width: 500px;
}

/* BUTTON */
.button {
  display: inline-block;
  padding: 12px 24px;
  background: black;
  color: white;
  text-decoration: none;
  margin-top: 15px;
}

/* MOBILE */
@media (max-width: 768px) {
  .hero h1 {
    font-size: 28px;
  }

  .hero {
    padding: 60px 15px 30px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HERO -->
  <section class="hero">
    <h1>Angelynn Arts</h1>
  </section>

  <!-- IMAGE / CONTENT -->
  <section class="image-block">
    <img src="https://static.wixstatic.com/media/YOUR_IMAGE_ID.jpg" alt="">
    <div>
      <a href="#" class="button">View More</a>
    </div>
  </section>

</div>

</body>
</html>
